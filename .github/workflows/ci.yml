name: CI

on:
  pull_request:
  push:
    branches: [main, "ci/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # No Firebase credentials in CI: data loaders fall back to empty content,
      # which is enough to prove the app compiles and renders.
      NEXT_PUBLIC_SITE_URL: "https://stonehillsda.org"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Runtime smoke test
        # Vercel functions cannot require() ES modules, unlike plain Node 24.
        # Disable it here so ESM-only transitive deps fail CI, not production.
        env:
          NODE_OPTIONS: --no-experimental-require-module
        run: bash scripts/smokeTest.sh

      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical
